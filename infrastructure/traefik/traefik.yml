# ==============================================================================
# CABINET MANAGER — traefik.yml (configuration statique)
# 2.4 API Gateway & sécurité réseau
# ==============================================================================

api:
  dashboard: true
  insecure: false          # jamais en clair ; exposé uniquement via le router "dashboard" protégé

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file       # appliqué globalement, voir dynamic_conf.yml

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
      # keyType: EC256    # option : certificats ECDSA plus légers

providers:
  docker:
    exposedByDefault: false     # un service Docker doit explicitement porter traefik.enable=true
    network: web
  file:
    filename: /etc/traefik/dynamic_conf.yml
    watch: true

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
  filters:
    statusCodes: ["400-599"]   # ne journalise en détail que les requêtes en erreur

# Limites globales de sécurité réseau
serversTransport:
  insecureSkipVerify: false

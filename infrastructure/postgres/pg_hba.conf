# ==============================================================================
# CABINET MANAGER — pg_hba.conf
# 2.2 Base de données — règles d'accès réseau à la base
# ==============================================================================
# TYPE    DATABASE        USER                    ADDRESS             METHOD

# Connexions locales (dans le conteneur, healthchecks, outils d'admin ponctuels)
local     all             all                                         scram-sha-256

# Connexions applicatives depuis le réseau interne Docker "backend" uniquement
# (aucune route publique vers Postgres : il n'est jamais exposé sur le réseau "web")
host      cabinet_manager cm_app_user             172.16.0.0/12       scram-sha-256

# Connexion dédiée à la réplication, restreinte au réseau interne
host      replication     replicator              172.16.0.0/12       scram-sha-256

# Connexion du rôle de sauvegarde (droits restreints, voir 2.2.4)
host      cabinet_manager cm_backup_user          172.16.0.0/12       scram-sha-256

# Toute autre tentative est explicitement rejetée
host      all             all                     0.0.0.0/0           reject

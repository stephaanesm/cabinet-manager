# ==============================================================================
# CABINET MANAGER — postgresql.conf (PostgreSQL 16)
# 2.2 Base de données — configuration primaire avec réplication en continu
# ==============================================================================

# ---------- CONNEXIONS ----------
listen_addresses = '*'
port = 5432
max_connections = 100

# ---------- MÉMOIRE (dimensionné pour un conteneur à 2 Go de RAM ; à ajuster
# selon la taille réelle de l'instance de production) ----------
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# ---------- ÉCRITURE / WAL (Write-Ahead Log) ----------
wal_level = replica              # requis pour la réplication en continu
max_wal_senders = 5               # nb max de connexions de réplication simultanées
max_replication_slots = 5
wal_keep_size = 1GB               # marge de rétention si la réplique décroche temporairement
synchronous_commit = on
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ---------- ARCHIVAGE (utilisé en complément des sauvegardes logiques, voir 2.2.3) ----------
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# ---------- JOURNALISATION ----------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500   # journalise les requêtes > 500 ms (détection de lenteurs)
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '

# ---------- SÉCURITÉ ----------
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
password_encryption = scram-sha-256

# ---------- AUTOVACUUM (important pour les tables à forte écriture : journal_activite,
# sync_operations_log) ----------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ---------- STATEMENT TIMEOUT (protection contre les requêtes bloquantes) ----------
statement_timeout = 30000          # 30 secondes
idle_in_transaction_session_timeout = 60000
